<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell an Item | CampusMart</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        Campus<span>Mart</span>
    </a>

    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="order.html">Orders</a>
        <a href="cart.html">🛒 Cart</a>

        <span id="loginArea"></span>

    </div>

</nav>


<div class="section">

    <div class="form-container">

        <h1>Sell an Item 📦</h1>

        <p class="form-subtitle">
            List something useful for another student.
        </p>


        <form onsubmit="sellProduct(event)">

            <div class="form-group">

                <label>Product Name</label>

                <input
                    id="name"
                    type="text"
                    placeholder="Example: Engineering Mathematics Book"
                    required
                >

            </div>


            <div class="form-group">

                <label>Description</label>

                <textarea
                    id="description"
                    placeholder="Describe the item..."
                    required></textarea>

            </div>


            <div class="form-group">

                <label>Category</label>

                <select id="category" required>

                    <option value="">Select category</option>
                    <option value="Books">Books</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Hostel">Hostel</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Others">Others</option>

                </select>

            </div>


            <div class="form-group">

                <label>Listing Type</label>

                <select id="listingType" required>

                    <option value="SALE">Sell</option>
                    <option value="RENT">Rent</option>
                    <option value="EXCHANGE">Exchange</option>

                </select>

            </div>


            <div class="form-group">

                <label>Condition</label>

                <select id="conditionType" required>

                    <option value="NEW">New</option>
                    <option value="LIKE_NEW">Like New</option>
                    <option value="GOOD">Good</option>
                    <option value="USED">Used</option>

                </select>

            </div>


            <div class="form-group">

                <label>Price (₹)</label>

                <input
                    id="price"
                    type="number"
                    min="0"
                    placeholder="500"
                    required
                >

            </div>


            <div class="form-group">

                <label>Rent Price (₹/day)</label>

                <input
                    id="rentPrice"
                    type="number"
                    min="0"
                    placeholder="100"
                >

            </div>


            <div class="form-group">

                <label>Available Quantity</label>

                <input
                    id="stock"
                    type="number"
                    min="1"
                    value="1"
                    required
                >

            </div>


            <div class="form-group">

                <label>Campus Location</label>

                <input
                    id="location"
                    type="text"
                    placeholder="Example: Block 01"
                    required
                >

            </div>


            <div class="form-group">

                <label>Image URL</label>

                <input
                    id="imageUrl"
                    type="url"
                    placeholder="Optional image URL"
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%;">
                Publish Listing
            </button>

        </form>

    </div>

</div>


<script src="js/app.js"></script>

<script>

async function sellProduct(event) {

    event.preventDefault();

    const user = getUser();

    if (!user) {

        alert("Please login first.");

        window.location.href = "login.html";

        return;
    }


    const product = {

        name: document.getElementById("name").value,

        description:
            document.getElementById("description").value,

        category:
            document.getElementById("category").value,

        listingType:
            document.getElementById("listingType").value,

        conditionType:
            document.getElementById("conditionType").value,

        price:
            Number(document.getElementById("price").value),

        rentPrice:
            Number(document.getElementById("rentPrice").value || 0),

        stock:
            Number(document.getElementById("stock").value),

        location:
            document.getElementById("location").value,

        imageUrl:
            document.getElementById("imageUrl").value,

        sellerId:
            user.id,

        sellerName:
            user.name
    };


    try {

        const response = await fetch(
            "http://localhost:8080/api/products",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(product)
            }
        );


        if (!response.ok) {
            throw new Error("Could not publish listing.");
        }


        alert("Your item has been listed successfully!");

        window.location.href = "index.html";


    } catch (error) {

        alert(error.message);

    }
}

</script>

</body>
</html>
