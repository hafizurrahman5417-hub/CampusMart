<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | CampusMart</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        Campus<span>Mart</span>
    </a>

    <div class="nav-links">

        <a href="index.html">Marketplace</a>

        <button
            onclick="logout()"
            class="btn btn-outline">
            Logout
        </button>

    </div>

</nav>


<section class="section">

    <h1 style="margin-bottom:8px;">
        Admin Dashboard
    </h1>

    <p style="color:#777;margin-bottom:30px;">
        Manage CampusMart marketplace activity.
    </p>


    <div class="stats-grid">

        <div class="stat-card">

            <p>Total Students</p>

            <h2 id="totalUsers">0</h2>

        </div>


        <div class="stat-card">

            <p>Total Products</p>

            <h2 id="totalProducts">0</h2>

        </div>


        <div class="stat-card">

            <p>Total Orders</p>

            <h2 id="totalOrders">0</h2>

        </div>

    </div>


    <div style="margin-top:35px;">

        <h2 class="section-title">
            Admin Features
        </h2>

        <div class="category-grid">

            <div class="category-card">

                <div class="category-icon">
                    👨‍🎓
                </div>

                <strong>
                    Manage Students
                </strong>

            </div>


            <div class="category-card">

                <div class="category-icon">
                    📦
                </div>

                <strong>
                    Manage Products
                </strong>

            </div>


            <div class="category-card">

                <div class="category-icon">
                    🛒
                </div>

                <strong>
                    Manage Orders
                </strong>

            </div>

        </div>

    </div>

</section>


<script src="js/app.js"></script>
<script src="js/admin.js"></script>

<script>
    loadAdminDashboard();
</script>

</body>
</html>
