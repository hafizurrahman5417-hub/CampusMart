<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | CampusMart</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">
            Campus<span>Mart</span>
        </a>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="sell.html">Sell</a>
            <a href="order.html">Orders</a>

            <span id="loginArea"></span>

        </div>

    </nav>


    <div class="cart-container">

        <h1>Shopping Cart 🛒</h1>

        <p style="color:#777;margin-bottom:25px;">
            Review your campus purchases.
        </p>


        <div id="cartItems"></div>


        <div class="cart-summary">

            <div class="summary-row">

                <span>Total</span>

                <span id="cartTotal" class="total">
                    ₹0
                </span>

            </div>


            <div style="margin-top:20px;">

                <label for="pickupLocation">
                    <strong>Pickup Location</strong>
                </label>

                <input type="text" id="pickupLocation" placeholder="Example: Block 01, Hostel Gate" style="
                    width:100%;
                    padding:12px;
                    margin-top:8px;
                    border:1px solid #ddd;
                    border-radius:8px;
                    box-sizing:border-box;
                ">

            </div>


            <button onclick="placeOrder()" class="btn btn-primary" style="
                display:block;
                width:100%;
                margin-top:20px;
            ">
                Place Order
            </button>

        </div>

    </div>


    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>


    <script>

        async function placeOrder() {

            const user = getUser();

            if (!user) {

                alert("Please login before placing an order.");

                window.location.href = "login.html";

                return;
            }


            const pickupLocation =
                document.getElementById("pickupLocation")
                    .value
                    .trim();


            if (!pickupLocation) {

                alert("Please enter a pickup location.");

                return;
            }


            try {

                const response = await fetch(
                    "http://localhost:8080/api/orders/place",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            userId: user.id,

                            pickupLocation: pickupLocation

                        })
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "Order could not be placed"
                    );

                }


                const order = await response.json();


                alert(
                    "Order placed successfully! Order #" +
                    order.id
                );


                window.location.href = "order.html";


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to place order. " +
                    "Make sure the backend is running."
                );

            }

        }

    </script>

</body>

</html>
